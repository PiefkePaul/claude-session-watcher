name: Docker

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

# Images go to the Gitea container registry on the NAS (pulled as
# git.scholz-cloud.de/piefkepaul/claude-session-watcher) instead of ghcr.io
# (GitHub storage quota), and to Docker Hub as before. The publish job runs on
# the NAS runners, which push to Gitea inside ci-net as plain http
# (gitea:3000): the public name runs through Cloudflare, which rejects request
# bodies over 100 MB.
env:
  IMAGE_NAME: claude-session-watcher
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
  GITEA_REGISTRY: gitea:3000
  GITEA_NAMESPACE: piefkepaul
  # The build record would be uploaded as an Actions artifact (full GitHub storage).
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

  publish:
    needs: test
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LINUX || '["self-hosted","nas","claude-session-watcher"]') }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Builder in the slot's network namespace (ci-net): resolves gitea:3000, plain http.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."gitea:3000"]
              http = true
              insecure = true

      - name: Log in to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GITEA_REGISTRY }}
          username: ${{ vars.GITEA_REGISTRY_USER || 'piefkepaul' }}
          password: ${{ secrets.GITEA_REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GITEA_REGISTRY }}/${{ env.GITEA_NAMESPACE }}/${{ env.IMAGE_NAME }}
            docker.io/${{ env.DOCKERHUB_NAMESPACE }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=beta,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Claude Session Watcher
            org.opencontainers.image.description=Background watcher for selected Claude Code Remote Control sessions

      - name: Set build date
        id: build_date
        shell: bash
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=0.1.0b2
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.build_date.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
